<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punishment Study</title>

    <!-- jsPsych 7.3.4 -->
    <script src="https://unpkg.com/jspsych@7.3.4/jspsych.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.2.0/index.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3/index.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">

    <style>
        /* ── Page layout ── */
        body { background: #fff; margin: 0; }

        .jspsych-content {
            max-width: 960px;
            width: 95%;
        }

        /* ── Scenario / intro videos ── */
        .scenario-video {
            display: block;
            width: 90%;
            max-height: 72vh;
            margin: 0 auto;
        }

        /* ── Continue button (after scenario/warmup videos) ── */
        #jspsych-html-button-response-btngroup .continue-btn {
            font-size: 1.1em;
            padding: 10px 36px;
            background: #4a90d9;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 14px;
        }

        #jspsych-html-button-response-btngroup .continue-btn:disabled {
            background: #aaa;
            cursor: default;
        }

        /* ── Question screen: question image + choice buttons ── */
        .question-image {
            display: block;
            margin: 0 auto 18px auto;
            width: 85%;
            max-height: 46vh;
            object-fit: contain;
        }

        /* ── Choice image buttons ── */
        #jspsych-html-button-response-btngroup {
            display: flex;
            justify-content: center;
            gap: 44px;
            flex-wrap: nowrap;
        }

        .jspsych-html-button-response-button button {
            border: 3px solid transparent;
            background: none;
            padding: 6px;
            border-radius: 12px;
            cursor: pointer;
            transition: border-color 0.15s, transform 0.1s;
            outline: none;
        }

        .jspsych-html-button-response-button button:hover:not(:disabled) {
            border-color: #4a90d9;
            transform: scale(1.05);
        }

        .jspsych-html-button-response-button button:disabled {
            cursor: default;
        }

        .choice-img {
            height: 190px;
            width: auto;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        /* ── Instructions screen ── */
        .instructions-box {
            max-width: 680px;
            margin: 30px auto;
            font-size: 1.1em;
            line-height: 1.7;
            text-align: left;
        }
        .instructions-box h2 { margin-bottom: 10px; }
        .instructions-box ul  { padding-left: 1.4em; }
    </style>
</head>
<body>
<script>

// ════════════════════════════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════════════════════════════

const BASE = 'https://raw.githubusercontent.com/SunnyZ-cs/lookit_material/master/children_pilot1_exp1mats_with_punish/';
const IMG  = src => BASE + 'img/' + src;
const VID  = src => BASE + 'mp4/' + src + '.mp4';

// Return the last underscore-separated segment of a filename (for data labels)
// e.g. 'boy_bike_case_suzy.png' → 'suzy',  'yes.png' → 'yes'
function lbl(src) {
    return src.replace(/.*\//, '').replace('.png', '').split('_').pop();
}

// ════════════════════════════════════════════════════════════════════
//  SCENARIOS & RANDOMIZATION
// ════════════════════════════════════════════════════════════════════

const character_order_condition = Math.random() < 0.5 ? 0 : 1;
const cause_break_order = Math.random() < 0.5 ? ["caused", "break"] : ["break", "caused"];
const question_order = [...cause_break_order, "fault", "punish"];

const characters = {
    "bike": ["andy", "suzy"],
    "mirror": ["bobby", "sophia"]
};

const scenario_list = Math.random() < 0.5 ? ["bike", "mirror"] : ["mirror", "bike"];

// Image mappings for the generic question background
const bg_images = {
    "bike": {
        "caused": "gender_order1/fence_scenario_boy_bike_caused_question.png",
        "break": "gender_order1/fence_scenario_boy_bike_break_question.png",
        "fault": "gender_order1/fence_scenario_boy_bike_fault_question.png",
        "punish": "gender_order1/fence_scenario_boy_bike_should_punish_question.png"
    },
    "mirror": {
        "caused": "gender_order1/mirror_scenario_girl_chair_caused_question.png",
        "break": "gender_order1/mirror_scenario_girl_chair_crack_question.png",
        "fault": "gender_order1/mirror_scenario_girl_chair_fault_question.png",
        "punish": "gender_order1/mirror_scenario_girl_chair_should_punish_question.png"
    }
};

// ════════════════════════════════════════════════════════════════════
//  INIT jsPsych
// ════════════════════════════════════════════════════════════════════

const jsPsych = initJsPsych({
    on_finish: function () {
        // ── Standalone / testing: download CSV automatically ──
        jsPsych.data.get().localSave('csv', 'punishment_study_data.csv');

        // ── JATOS (for Prolific): uncomment the line below and remove the one above ──
        // jatos.submitResultData(jsPsych.data.get().json(), jatos.startNextComponent);

        // ── Lookit (exp-lookit-jspsych): data is handled automatically; leave blank ──
    }
});

// condition parameters are evaluated inline now

// ════════════════════════════════════════════════════════════════════
//  TRIAL BUILDERS
// ════════════════════════════════════════════════════════════════════

/**
 * videoTrial – plays a fullscreen video; Continue button is disabled
 * until the video finishes (so experimenter/parent clicks to proceed).
 */
function videoTrial(videoName, trialType) {
    return {
        type: jsPsychHtmlButtonResponse,
        stimulus: `<video id="trial-video" class="scenario-video"
                         src="${VID(videoName)}" autoplay playsinline></video>`,
        choices: ['Continue ▶'],
        button_html: '<button class="jspsych-btn continue-btn">%choice%</button>',
        on_load: function () {
            const btn = document.querySelector(
                '#jspsych-html-button-response-btngroup button'
            );
            btn.disabled = true;
            document.getElementById('trial-video').addEventListener('ended', () => {
                btn.disabled = false;
            });
            // Safety: enable after 5 minutes if video event never fires
            setTimeout(() => { btn.disabled = false; }, 300_000);
        },
        data: { trial_type: trialType, video: videoName, condition: character_order_condition }
    };
}

/**
 * questionTrial – the key jsPsych improvement over Lookit:
 *   1. Question image is shown immediately at top of screen.
 *   2. Question audio (video) plays in the background.
 *   3. After audio ends, the two choice images appear as clickable buttons.
 *
 * response index: 0 = left button, 1 = right button
 */
function questionTrial({ videoName, questionImgSrc, leftImgSrc, rightImgSrc, questionType, scenarioId }) {
    const leftLabel  = lbl(leftImgSrc);
    const rightLabel = lbl(rightImgSrc);

    return {
        type: jsPsychHtmlButtonResponse,
        stimulus: `
            <img src="${questionImgSrc}" class="question-image" alt="question">
            <video id="q-audio" src="${VID(videoName)}"
                   style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;"
                   autoplay playsinline></video>`,
        choices: [
            `<img src="${leftImgSrc}"  class="choice-img" alt="${leftLabel}">`,
            `<img src="${rightImgSrc}" class="choice-img" alt="${rightLabel}">`
        ],
        on_load: function () {
            const group = document.getElementById('jspsych-html-button-response-btngroup');
            if (group) {
                group.style.visibility = 'hidden';
                group.querySelectorAll('button').forEach(b => { b.disabled = true; });
            }

            const reveal = () => {
                if (!group) return;
                group.style.visibility = 'visible';
                group.querySelectorAll('button').forEach(b => { b.disabled = false; });
            };

            const vid = document.getElementById('q-audio');
            vid.addEventListener('ended', reveal);
            vid.addEventListener('error', reveal);   // fallback if file fails to load
            setTimeout(reveal, 30_000);              // ultimate fallback after 30 s
        },
        data: {
            trial_type:  questionType,
            scenario:    scenarioId,
            condition:   character_order_condition,
            left_label:  leftLabel,
            right_label: rightLabel,
            video:       videoName
        },
        response_ends_trial: true
    };
}

// ════════════════════════════════════════════════════════════════════
//  BUILD SCENARIO TIMELINE
// ════════════════════════════════════════════════════════════════════

function buildScenarioTimeline(scenarioKey) {
    const trials = [];
    const is_bike = scenarioKey === "bike";
    const intro_vid = "test_case_intro";
    const scenario_vid = is_bike ? "fence_scenario_boy_bike" : "mirror_scenario_girl_chair";
    const scenario_prefix = is_bike ? "fence_scenario_boy_bike" : "mirror_scenario_girl_chair";

    // 1. Intro video (experimenter clicks Continue after watching)
    trials.push(videoTrial(intro_vid, 'intro'));

    // 2. Scenario video
    trials.push(videoTrial(scenario_vid, 'scenario'));

    // Determine character order for this scenario
    let scenario_chars = characters[scenarioKey];
    if (character_order_condition === 1) {
        scenario_chars = [scenario_chars[1], scenario_chars[0]];
    }

    // Generate the 8 Yes/No questions iteratively
    for (const q_type of question_order) {
        for (const character of scenario_chars) {
            // Mirror uses 'crack' instead of 'break' for the action question
            const type_for_file = (q_type === "break" && !is_bike) ? "crack" : q_type;
            const videoName = `${scenario_prefix}_${type_for_file}_${character}_question`;
            const bg_img = bg_images[scenarioKey][q_type];

            trials.push(questionTrial({
                videoName: videoName,
                questionImgSrc: IMG(bg_img),
                leftImgSrc: IMG('yes.png'),
                rightImgSrc: IMG('no.png'),
                questionType: `${q_type}_${character}`,
                scenarioId: scenarioKey
            }));
        }
    }

    return trials;
}

// ════════════════════════════════════════════════════════════════════
//  WARMUP TIMELINE
//
//  Same design as main experiment:
//    video plays (experimenter clicks Continue)  →
//    question image shown + audio replays  →
//    choices appear after audio
// ════════════════════════════════════════════════════════════════════

const WARMUP_Q_IMG = IMG('warmup_question.png');

function warmupQuestionTrial(videoName, leftImg, rightImg) {
    return questionTrial({
        videoName,
        questionImgSrc: WARMUP_Q_IMG,
        leftImgSrc:     IMG(leftImg),
        rightImgSrc:    IMG(rightImg),
        questionType:   'warmup',
        scenarioId:     'warmup'
    });
}

const warmupTimeline = [
    videoTrial('warmup_yes_question_new', 'warmup_video'),
    warmupQuestionTrial('warmup_yes_question_new', 'yes.png', 'no.png'),

    videoTrial('warmup_part2_no_question', 'warmup_video'),
    warmupQuestionTrial('warmup_part2_no_question', 'yes.png', 'no.png'),

    videoTrial('warmup_finish', 'warmup_video')
];

// ════════════════════════════════════════════════════════════════════
//  FULL TIMELINE
// ════════════════════════════════════════════════════════════════════

const timeline = [
    // ── Parent instructions ──
    {
        type: jsPsychHtmlButtonResponse,
        stimulus: `
            <div class="instructions-box">
                <h2>Overview</h2>
                <ul>
                    <li>The study takes about 8–10 minutes.</li>
                    <li>Your child will watch short videos and answer questions by clicking pictures.</li>
                    <li>There are no right or wrong answers.</li>
                </ul>
                <p><strong>For parents:</strong> Please help keep your child's attention,
                   but don't tell them which answer to choose.</p>
            </div>`,
        choices: ['Start ▶'],
        button_html: '<button class="jspsych-btn continue-btn">%choice%</button>',
        data: { trial_type: 'instructions' }
    },

    // ── Introduction video ──
    videoTrial('overall_study_intro', 'intro_video'),

    // ── Warmup ──
    ...warmupTimeline,

    // Record randomizations at the start of scenarios
    {
        type: jsPsychHtmlButtonResponse,
        stimulus: '',
        choices: [],
        trial_duration: 0,
        data: {
            trial_type: 'randomization_info',
            scenario_order: scenario_list,
            question_order: question_order,
            character_order_condition: character_order_condition
        }
    },

    // ── Main experiment: Scenario 1 ──
    ...buildScenarioTimeline(scenario_list[0]),

    // ── Main experiment: Scenario 2 ──
    ...buildScenarioTimeline(scenario_list[1]),

    // ── End video ──
    videoTrial('overall_study_end', 'end_video')
];

// Run the experiment
jsPsych.run(timeline);

</script>
</body>
</html>
